name: CI

on:
  workflow_call:
    secrets:
      DEPENDENCY_TOKEN:
        description: Token with read access to private dependency repositories
        required: false
    inputs:
      ignore_tidy:
        description: Paths excluded from clang-tidy
        required: false
        type: string
        default: 'tests/**|build/**'
      ignore_format:
        description: Paths excluded from clang-format
        required: false
        type: string
        default: 'tests/**|build/**'

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure access to private dependencies
        env:
          DEPENDENCY_TOKEN: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
        run: |
          set -euo pipefail

          # Remove checkout's repository-scoped extraheader so Git can use the
          # caller-provided token for private cross-repository dependencies.
          git config --local --unset-all \
            http.https://github.com/.extraheader || true

          git config --global credential.helper store

          printf 'https://x-access-token:%s@github.com\n' \
            "$DEPENDENCY_TOKEN" > "$HOME/.git-credentials"

          chmod 600 "$HOME/.git-credentials"

      - name: Build
        run: make BUILD_TYPE=${{ matrix.build_type }} build

      - name: C/C++ Lint (clang-format + clang-tidy)
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '22'
          style: 'file'
          tidy-checks: ''
          database: build
          files-changed-only: false
          file-annotations: true
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' }}
          ignore-tidy: ${{ inputs.ignore_tidy }}
          ignore-format: ${{ inputs.ignore_format }}

      - name: Fail on lint issues
        if: |
          steps.linter.outputs.clang-format-checks-failed > 0 ||
          steps.linter.outputs.clang-tidy-checks-failed > 0
        run: exit 1

      - name: Test
        id: test
        env:
          GTEST_COLOR: 1
        run: |
          ctest --test-dir build \
                --output-on-failure \
                -C ${{ matrix.build_type }} \
                --output-junit test-results.xml

      - name: Publish test report
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        uses: dorny/test-reporter@v1
        with:
          name: GoogleTest (${{ matrix.os }} / ${{ matrix.build_type }})
          path: build/test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Remove private dependency credentials
        if: always()
        run: rm -f "$HOME/.git-credentials"
